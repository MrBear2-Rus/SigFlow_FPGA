[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigflow-teaching-core"
version = "0.1.0"
description = "U2 teaching loop domain core and DeepSeek development adapter"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
course-build = ["PyYAML>=6.0"]

[project.scripts]
sigflow-agent = "sigflow_teaching_core.__main__:main"
sigflow-u2-host = "sigflow_teaching_core.host.__main__:main"
sigflow-deepseek = "sigflow_teaching_core.model_config:main"

[tool.setuptools.packages.find]
include = ["sigflow_teaching_core*"]

[tool.setuptools.package-data]
"sigflow_teaching_core.rag" = ["resources/courses/*.yaml", "resources/courses/*.jsonl", "resources/courses/passages/*.jsonl", "resources/courses/external/*.md"]

[tool.setuptools.exclude-package-data]
"sigflow_teaching_core.rag" = ["resources/courses/external_official_passages.jsonl", "resources/courses/external_official_spans.jsonl", "resources/courses/external_official_translations.jsonl"]
