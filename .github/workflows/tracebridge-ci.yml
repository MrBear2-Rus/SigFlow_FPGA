name: TraceBridge CI

on:
  push:
    paths:
      - 'main/**'
      - 'rtl/debug/**'
      - 'tests/debug/**'
      - 'tests/wave/**'
      - 'tools/run_debug_ci.ps1'
      - 'tools/run_multiclock_rtl_check.ps1'
      - 'tools/run_tracebridge_replay_smoke.ps1'
      - 'examples/tracebridge_replay_smoke/**'
      - '3rd/**'
      - 'external/**'
      - 'plugin_sdk/**'
      - 'SigFlow.sln'
      - 'main/GlobalConfig.props'
      - 'main/main.vcxproj'
  pull_request:
    paths:
      - 'main/**'
      - 'rtl/debug/**'
      - 'tests/debug/**'
      - 'tests/wave/**'
      - 'tools/run_debug_ci.ps1'
      - 'tools/run_multiclock_rtl_check.ps1'
      - 'tools/run_tracebridge_replay_smoke.ps1'
      - 'examples/tracebridge_replay_smoke/**'
      - '3rd/**'
      - 'external/**'
      - 'plugin_sdk/**'
      - 'SigFlow.sln'
      - 'main/GlobalConfig.props'
      - 'main/main.vcxproj'
  workflow_dispatch:

jobs:
  debug-and-solution:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Visual Studio
        id: vs
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installPath) { throw 'Visual Studio C++ toolchain was not found.' }
          "devcmd=$installPath\Common7\Tools\VsDevCmd.bat" >> ${env:GITHUB_OUTPUT}

      - name: Run TraceBridge regression
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\run_debug_ci.ps1 -VsDevCmd '${{ steps.vs.outputs.devcmd }}'

      - name: Check multi-clock RTL
        shell: pwsh
        run: |
          & pwsh -NoProfile -ExecutionPolicy Bypass -File tools\run_multiclock_rtl_check.ps1

      - name: Build SigFlow solution
        shell: pwsh
        run: |
          $devcmd = '${{ steps.vs.outputs.devcmd }}'
          $command = "call `"$devcmd`" -arch=x64 -host_arch=x64 >nul && msbuild SigFlow.sln /m /p:Configuration=Debug /p:Platform=x64"
          & cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw "SigFlow.sln failed with exit code $LASTEXITCODE" }
