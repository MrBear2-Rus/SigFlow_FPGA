<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SigFlow · 画布</title>
    <link rel="stylesheet" href="/styles/app.css">
</head>
<body>
    <header>
        <h1>SigFlow · 画布</h1>
        <a class="link" href="/">← 返回控制台</a>
        <span id="account" class="muted">未登录</span>
        <span id="status" class="muted"></span>
    </header>

    <main class="canvas-layout">
        <aside class="panel">
            <h2>工程</h2>
            <select id="projectSelect"></select>

            <h2>元件库</h2>
            <div id="palette" class="palette"></div>

            <h2>操作</h2>
            <div class="row wrap">
                <button id="wireMode" aria-pressed="false">连线模式</button>
                <button id="deleteSelected">删除选中</button>
                <button id="saveCanvas">保存</button>
                <button id="reloadCanvas">重载</button>
            </div>
            <p class="muted small">
                拖拽元件移动；连线模式下依次点击输出引脚与输入引脚；选中后按 Delete 删除。
            </p>
        </aside>

        <section class="panel board-panel">
            <div class="board-wrap">
                <svg id="board" width="2000" height="1200" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
                            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#232936" stroke-width="1"/>
                        </pattern>
                    </defs>
                    <rect width="2000" height="1200" fill="url(#grid)"/>
                    <g id="wireLayer"></g>
                    <g id="nodeLayer"></g>
                </svg>
            </div>
        </section>
    </main>

    <script type="module" src="/scripts/canvas.js"></script>
</body>
</html>
