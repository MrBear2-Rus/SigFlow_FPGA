<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SigFlow · 调试契约</title>
    <link rel="stylesheet" href="/styles/theme.css">
    <link rel="stylesheet" href="/styles/components.css">
    <link rel="stylesheet" href="/styles/window.css">
</head>
<body class="win">
    <header class="win-head">
        <img class="brand-mark" src="/assets/icons/ui/file.svg" alt="">
        <h1>Debug Contract</h1>
        <span class="project" id="projectName"></span>
        <span class="spacer"></span>
        <div class="actions">
            <a class="btn btn-ghost btn-sm" id="workspaceLink" href="/pages/projects.html">工作区</a>
            <button class="btn btn-ghost btn-sm" id="closeWindow">关闭窗口</button>
        </div>
    </header>

    <div class="win-body">
        <div class="split-2">
            <section class="card card-block">
                <h2>通用</h2>
                <div class="field-row">
                    <label for="dc-top">顶层模块</label>
                    <input id="dc-top" class="input" value="top">
                </div>
                <div class="field-row">
                    <label for="dc-trigger">触发模式</label>
                    <select id="dc-trigger" class="input">
                        <option value="none">none</option>
                        <option value="mask_equal">mask_equal</option>
                        <option value="edge_rising">edge_rising</option>
                    </select>
                </div>
                <div class="field-row">
                    <label for="dc-depth">采样深度</label>
                    <input id="dc-depth" class="input" value="1024">
                </div>
                <div class="field">
                    <label for="dc-probe">探针表达式</label>
                    <textarea id="dc-probe" class="input" rows="6" placeholder="例如 {clk, led, count[3:0]}"></textarea>
                </div>
                <p class="hint">
                    保存与下发需要 C++ capture 契约（P8）与 Node 的设备租约，当前仅保留表单结构。
                </p>
            </section>

            <section class="card card-block">
                <h2>预览</h2>
                <pre id="dc-preview" class="hint" style="font-family:var(--font-mono);white-space:pre-wrap">{
  "top_module": "top",
  "trigger": "none",
  "depth": 1024
}</pre>
                <div class="row">
                    <button class="btn" id="dc-save" disabled>保存（待 C++ P8）</button>
                    <button class="btn" id="dc-close">关闭</button>
                </div>
            </section>
        </div>
    </div>

    <script type="module" src="/scripts/debug-contract.js"></script>
</body>
</html>
